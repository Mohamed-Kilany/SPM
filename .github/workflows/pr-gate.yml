name: PR gate

# This workflow is intentionally pull-request-only. There are no push,
# pull_request_target or schedule triggers: master is advanced exclusively by
# a reviewed pull request whose required checks have passed.
on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  go:
    name: "Go: fmt, vet, test, build"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum

      - name: Download modules
        run: go mod download

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l internal cmd)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Check the OpenAPI contract
        run: go run ./cmd/openapi -check

      - name: Test with the race detector
        run: go test ./... -count=1 -race -timeout=180s

      - name: Build the API binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/spm-api ./cmd/api

  ui:
    name: "UI: typecheck, test, build"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint the OpenAPI contract
        working-directory: .
        run: npx --yes @redocly/cli@2.0.8 lint docs/openapi.yaml

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --reporter=verbose

      - name: Production build
        run: npm run build

  ai:
    name: "AI: pytest"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ai/requirements.txt
            ai/requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-test.txt

      - name: Run the AI service tests
        run: python -m pytest -q

  compose:
    name: "Compose: config"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7

      - name: Validate the production stack
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yaml config --quiet

      - name: Validate the isolated test stack
        run: docker compose -f docker-compose.test.yml config --quiet

  images:
    name: "Images: docker build"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - go
      - ui
      - ai
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.api
          push: false
          load: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build the UI image
        uses: docker/build-push-action@v7
        with:
          context: ./ui
          file: ./ui/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

      - name: Build the AI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./ai/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai

  dependency-review:
    name: "Security: dependency review"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
