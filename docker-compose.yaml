# SPM Platform â€” Full Production Stack
#
# Host ports (no conflicts):
#   5432  â€” PostgreSQL
#   4222  â€” NATS (clients)
#   8222  â€” NATS (monitoring)
#   3000  â€” Gitea HTTP
#   2222  â€” Gitea SSH
#   8080  â€” SPM API (direct)
#   80    â€” UI (Envoy edge â†’ internal nginx SPA + /api/ proxy)
#   9090  â€” Argo CD
#
# Resource policy: no artificial memory caps. Size the host for the workload.

networks:
  spm_net:
    driver: bridge

volumes:
  postgres_data:
  nats_data:
  gitea_data:
  act_runner_data:
  k3s_data:
  k3s_kubeconfig:

services:

  # â”€â”€ PostgreSQL â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-spm}
      POSTGRES_USER:     ${POSTGRES_USER:-spm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # PostgreSQL 18 keeps its cluster below /var/lib/postgresql; mount the
      # parent volume so the default version-specific PGDATA is persisted.
      PGDATA:            /var/lib/postgresql/18/docker
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=100
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./api/internal/migrate/sql:/docker-entrypoint-initdb.d:ro
    networks:
      - spm_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spm} -d ${POSTGRES_DB:-spm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # â”€â”€ NATS JetStream â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
    networks:
      - spm_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # â”€â”€ Gitea â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  gitea:
    # Gitea 1.24+ is required for the stable Actions runs API that SPM uses
    # to reconcile CI results without manual status entry.
    image: gitea/gitea:1.24.7
    restart: unless-stopped
    environment:
      USER_UID:                        "1000"
      USER_GID:                        "1000"
      GITEA__database__DB_TYPE:        postgres
      GITEA__database__HOST:           postgres:5432
      GITEA__database__NAME:           ${GITEA_DB:-git}
      GITEA__database__USER:           ${POSTGRES_USER:-spm}
      GITEA__database__PASSWD:         ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      GITEA__server__ROOT_URL:         ${GITEA_ROOT_URL:-http://localhost:3000}
      GITEA__server__HTTP_PORT:        "3000"
      GITEA__server__SSH_PORT:         "22"
      GITEA__server__SSH_LISTEN_PORT:  "22"
      GITEA__security__SECRET_KEY:     ${GITEA_SECRET_KEY:?GITEA_SECRET_KEY is required}
      GITEA__security__INTERNAL_TOKEN: ${GITEA_INTERNAL_TOKEN:?GITEA_INTERNAL_TOKEN is required}
      GITEA__security__INSTALL_LOCK:   "true"
      GITEA__actions__ENABLED:         "true"
      # SPM's webhook receiver is reachable by its Compose service name. Gitea
      # rejects private/localhost webhook targets unless the host is allowlisted.
      GITEA__webhook__ALLOWED_HOST_LIST: "api_backend,localhost,127.0.0.1"
      GITEA__log__LEVEL:               "Info"
    ports:
      - "${GITEA_HTTP_PORT:-3000}:3000"
      - "${GITEA_SSH_PORT:-2222}:22"
    volumes:
      - gitea_data:/data
    networks:
      - spm_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/healthz || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

  # â”€â”€ Gitea act_runner â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  act_runner:
    image: gitea/act_runner:nightly
    restart: unless-stopped
    environment:
      GITEA_INSTANCE_URL:              http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_TOKEN:?GITEA_RUNNER_TOKEN is required}
      GITEA_RUNNER_NAME:               spm-runner
      # Keep CI jobs on the small, already-cached Alpine image instead of
      # pulling a multi-gigabyte runner image. The workflow steps use sh.
      GITEA_RUNNER_LABELS:             "ubuntu-latest:docker://alpine:3.21,ubuntu-24.04:docker://alpine:3.21"
    volumes:
      # Jobs execute in sibling containers, so the runner needs the host
      # Docker socket. This is a local/on-prem requirement of act_runner.
      - /var/run/docker.sock:/var/run/docker.sock
      - act_runner_data:/data
    networks:
      - spm_net
    depends_on:
      gitea:
        condition: service_healthy

  # â”€â”€ Argo CD â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Lightest real Kubernetes distribution for the local stack: k3s with
  # embedded SQLite. Argo CD runs inside this cluster instead of as a
  # disconnected standalone container.
  k3s:
    image: rancher/k3s:v1.36.5-k3s1
    container_name: spm-k3s
    restart: unless-stopped
    privileged: true
    cgroup: host
    hostname: k3s
    environment:
      K3S_TOKEN:              "${K3S_TOKEN:-spm-local-k3s-token}"
      K3S_KUBECONFIG_MODE:    "644"
      K3S_KUBECONFIG_OUTPUT:  /output/kubeconfig.yaml
    command:
      - server
      - --disable=traefik,servicelb,metrics-server,local-storage
      - --tls-san=k3s
      - --tls-san=localhost
    tmpfs:
      - /run
      - /var/run
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - k3s_data:/var/lib/rancher/k3s
      - k3s_kubeconfig:/output
      - ./k8s:/manifests:ro
    ports:
      - "${K3S_API_PORT:-6443}:6443"
      - "${ARGOCD_PORT:-9090}:30080"
    networks:
      - spm_net
    healthcheck:
      test: ["CMD-SHELL", "KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl get --raw=/readyz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # k3s pods do not always have the same egress path as the Docker daemon
  # (notably on Docker Desktop). Import the Argo CD and CoreDNS images from
  # the host daemon so first start works on restricted or offline networks.
  k8s_images:
    image: docker:29-cli
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for image in \
          quay.io/argoproj/argocd:v3.5.6 \
          ghcr.io/dexidp/dex:v2.45.1 \
          public.ecr.aws/docker/library/redis:8.2.3-alpine \
          rancher/mirrored-pause:3.10.2 \
          rancher/mirrored-coredns-coredns:1.14.7; do
          if ! docker image inspect "$$image" >/dev/null 2>&1; then
            docker pull "$$image"
          fi
          docker save "$$image" --platform linux/amd64 -o /tmp/image.tar
          # Docker Desktop's containerd image store can emit a metadata-only
          # tar for the mirrored CoreDNS image. Re-import its rootfs as a
          # single layer so k3s always receives real layer blobs.
          if [ "$$image" = "rancher/mirrored-coredns-coredns:1.14.7" ] && [ "$(stat -c%s /tmp/image.tar)" -lt 1000000 ]; then
            docker rm -f spm-image-rootfs >/dev/null 2>&1 || true
            docker create --name spm-image-rootfs "$$image" >/dev/null
            docker export spm-image-rootfs -o /tmp/rootfs.tar
            docker rm -f spm-image-rootfs >/dev/null
            mkdir -p /tmp/coredns-build
            docker import /tmp/rootfs.tar spm/coredns-base:1.14.7 >/dev/null
            cat > /tmp/coredns-build/Dockerfile <<'EOF'
        FROM spm/coredns-base:1.14.7
        USER 65532:65532
        ENTRYPOINT ["/coredns"]
        EXPOSE 53/tcp 53/udp
        ENV PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        ENV SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
        WORKDIR /
        EOF
            docker build -t "$$image" /tmp/coredns-build >/dev/null
            rm -rf /tmp/coredns-build /tmp/rootfs.tar
            docker save "$$image" --platform linux/amd64 -o /tmp/image.tar
          fi
          docker exec -i spm-k3s sh -c 'cat > /tmp/image.tar' < /tmp/image.tar
          docker exec spm-k3s ctr --address /run/k3s/containerd/containerd.sock --namespace k8s.io images import --snapshotter overlayfs /tmp/image.tar
          docker exec spm-k3s rm -f /tmp/image.tar
          rm -f /tmp/image.tar
        done
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - spm_net
    depends_on:
      k3s:
        condition: service_healthy

  # One-shot bootstrap: install the vendored Argo CD manifests into k3s.
  # Idempotent, so re-running the stack is safe.
  k8s_bootstrap:
    image: rancher/k3s:v1.36.5-k3s1
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        cp /kubeconfig/kubeconfig.yaml /tmp/kubeconfig
        kubectl config set-cluster default --server=https://k3s:6443 --kubeconfig=/tmp/kubeconfig
        kubectl apply --server-side --force-conflicts -k /manifests/argocd --kubeconfig=/tmp/kubeconfig
    volumes:
      - ./k8s:/manifests:ro
      - k3s_kubeconfig:/kubeconfig:ro
    networks:
      - spm_net
    depends_on:
      k3s:
        condition: service_healthy
      k8s_images:
        condition: service_completed_successfully

  # ── AI service — stateless CPU-only semantic search and RAG ────────────────
  ai_service:
    build:
      context: .
      dockerfile: ai/Dockerfile
      args:
        AI_LLM: "${AI_LLM:-0}"
    image: spm-ai:local
    restart: unless-stopped
    environment:
      PORT: "8090"
      SPM_AI_DISABLE_LLM: "${SPM_AI_DISABLE_LLM:-1}"
      SPM_AI_MODEL_PATH: "${SPM_AI_MODEL_PATH:-}"
      SPM_AI_THREADS: "${SPM_AI_THREADS:-2}"
    networks:
      - spm_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── SPM API Backend ───────────────────────────────────────────────────────â”€
  api_backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL:              "postgres://${POSTGRES_USER:-spm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-spm}?sslmode=disable"
      NATS_URL:                  "nats://nats:4222"
      NATS_EVENT_RETENTION_DAYS: "${NATS_EVENT_RETENTION_DAYS:-90}"
      JWT_SECRET:                "${JWT_SECRET:?JWT_SECRET is required}"
      JWT_EXPIRY_HOURS:          "${JWT_EXPIRY_HOURS:-8}"
      GITEA_BASE_URL:            "http://gitea:3000"
      GITEA_API_TOKEN:           "${GITEA_API_TOKEN:?GITEA_API_TOKEN is required}"
      GITEA_ORG:                 "${GITEA_ORG:-spm}"
      GITEA_WEBHOOK_SECRET:      "${GITEA_WEBHOOK_SECRET:?GITEA_WEBHOOK_SECRET is required}"
      GITEA_PUBLIC_URL:          "${GITEA_ROOT_URL:-http://localhost:3000}"
      SPM_WEBHOOK_BASE_URL:      "${SPM_WEBHOOK_BASE_URL:-http://api_backend:8080}"
      SPM_INTERNAL_WEBHOOK_URL:  "${SPM_INTERNAL_WEBHOOK_URL:-http://api_backend:8080/api/v1/webhooks/gitea}"
      ARGOCD_WEBHOOK_TOKEN:      "${ARGOCD_WEBHOOK_TOKEN:?ARGOCD_WEBHOOK_TOKEN is required}"
      ARGOCD_ENABLED:            "${ARGOCD_ENABLED:-true}"
      ARGOCD_BASE_URL:           "${ARGOCD_BASE_URL:-http://k3s:30080}"
      ARGOCD_TOKEN:              "${ARGOCD_TOKEN:-}"
      MANIFEST_REPO_PATH:        "${MANIFEST_REPO_PATH:-spm-manifests}"
      MANIFEST_IMAGE_TAG_PATH:   "${MANIFEST_IMAGE_TAG_PATH:-deploy/image-tag.txt}"
      AI_SERVICE_URL:            "http://ai_service:8090"
      PORT:                      "8080"
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - spm_net
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      k8s_bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # â”€â”€ UI static server â€” Vue SPA built inside Docker â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Internal only: Envoy is the public edge and proxies API traffic directly.
  # The image is built from ui/Dockerfile; host ui/dist is never mounted.
  ui_static:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        NGINX_IMAGE: nginx:1.30.5-alpine-otel
    image: spm-ui:local
    restart: unless-stopped
    networks:
      - spm_net
    depends_on:
      # nginx resolves the API upstream during startup; wait until the API
      # container has a DNS record and is healthy.
      api_backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # â”€â”€ Envoy edge â€” public HTTP entry point â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Port 80: SPA + static assets via ui_static, /api/ via api_backend.
  # See envoy/envoy.yaml for the SSE-specific zero-timeout route.
  ui_envoy:
    image: envoyproxy/envoy:v1.29.12
    restart: unless-stopped
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "${UI_PORT:-80}:8080"
    networks:
      - spm_net
    depends_on:
      api_backend:
        condition: service_healthy
      ui_static:
        condition: service_healthy
    healthcheck:
      # The Envoy image has no curl/wget; a bash TCP probe is sufficient to
      # confirm the edge listener is accepting connections.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
