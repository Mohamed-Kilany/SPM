components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    streamTicket:
      type: apiKey
      in: query
      name: ticket
      description: Single-use ticket issued by POST /api/v1/auth/stream-ticket.
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: "The caller is authenticated but not authorized"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: "The resource already exists or conflicts with current state"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: "Rate limit exceeded"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: "Unexpected server error"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: "The request is valid but violates a business rule"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PreconditionRequired:
      description: "A mutation of a revisioned planning resource requires the current revision in If-Match or expected_version"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RevisionConflict:
      description: "The revision is stale; current_version is the value to retry from"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RevisionConflict'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
    User:
      type: object
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        email: {type: string}
        display_name: {type: string}
        avatar_url: {type: string}
        role: {type: string, enum: [admin, member, viewer]}
        project_ids:
          type: array
          items: {type: string, format: uuid}
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectAccess'
    ProjectSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        key_prefix: {type: string}
        work_item_count: {type: integer}
        done_work_item_count: {type: integer}
        test_case_count: {type: integer}
        open_bug_count: {type: integer}
        last_activity_at: {type: string, format: date-time}
    Workspace:
      type: object
      description: Complete aggregate. See ui/src/types/workspace.ts for the typed client contract.
      properties:
        project: {type: object}
        prds: {type: array, items: {type: object}}
        epics: {type: array, items: {type: object}}
        features: {type: array, items: {type: object}}
        work_items: {type: array, items: {type: object}}
        test_cases: {type: array, items: {type: object}}
        test_runs: {type: array, items: {type: object}}
        repositories: {type: array, items: {type: object}}
        branches: {type: array, items: {type: object}}
        pull_requests: {type: array, items: {type: object}}
        builds: {type: array, items: {type: object}}
        environments: {type: array, items: {type: object}}
        deployments: {type: array, items: {type: object}}
        health_checks: {type: array, items: {type: object}}
        activity: {type: array, items: {type: object}}
        revision: {type: integer}
    PRDInput:
      type: object
      required: [title]
      properties:
        title: {type: string}
        summary: {type: string}
        content: {type: string}
        status: {type: string}
        expected_version: {type: [integer, "null"], format: int64, minimum: 1, description: Current revision; alternative to If-Match and the query parameter.}
    EpicInput:
      type: object
      required: [prd_id, title]
      properties:
        prd_id: {type: string, format: uuid}
        title: {type: string}
        description: {type: string}
        status: {type: string}
        expected_version: {type: [integer, "null"], format: int64, minimum: 1, description: Current revision; alternative to If-Match and the query parameter.}
    FeatureInput:
      type: object
      required: [epic_id, title]
      properties:
        epic_id: {type: string, format: uuid}
        title: {type: string}
        description: {type: string}
        status: {type: string}
        expected_version: {type: [integer, "null"], format: int64, minimum: 1, description: Current revision; alternative to If-Match and the query parameter.}
    WorkItemInput:
      type: object
      required: [type, title]
      properties:
        type: {type: string, enum: [story, task, subtask, bug]}
        title: {type: string}
        description: {type: string}
        feature_id: {type: string, format: uuid}
        parent_id: {type: string, format: uuid}
        status: {type: string}
        priority: {type: string}
        severity: {type: string}
        estimate_points: {type: number}
        sprint_id: {type: string, format: uuid}
        release_id: {type: string, format: uuid}
        environment_id: {type: string, format: uuid}
        expected_version: {type: [integer, "null"], format: int64, minimum: 1, description: Current revision; alternative to If-Match and the query parameter.}
    TestCaseInput:
      type: object
      description: Creating or editing a case stores an immutable version snapshot. Steps are replaced as a set and each needs an action and an expected result.
      required: [title, feature_id, steps]
      properties:
        feature_id: {type: string, format: uuid}
        title: {type: string, maxLength: 255}
        description: {type: string}
        preconditions: {type: string}
        type: {type: string, enum: [manual, automated], default: manual}
        priority: {type: string, enum: [low, medium, high, critical], default: medium}
        status: {type: string, enum: [draft, ready, deprecated], default: draft}
        automation_ref: {type: string, maxLength: 1024}
        owner_id: {type: [string, "null"], format: uuid, description: Must be a project member.}
        tags:
          type: array
          items: {type: string}
        steps:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [action, expected_result]
            properties:
              shared_step_id: {type: [string, "null"], format: uuid, description: Optional template this step was copied from; the text is still stored on the case.}
              action: {type: string}
              expected_result: {type: string}
              test_data: {type: string}
        expected_version: {type: [integer, "null"], format: int64, minimum: 1, description: Current revision; alternative to If-Match and the query parameter.}
    TestRunInput:
      type: object
      description: Runs snapshot plan and suite names plus each result's case revision. Precedence is test_case_ids, then filter, then suite_id, then plan_id, then every case in the project.
      properties:
        name: {type: string}
        status: {type: string, default: planned}
        release_id: {type: [string, "null"], format: uuid}
        sprint_id: {type: [string, "null"], format: uuid}
        environment_id: {type: string, format: uuid, description: Required; must belong to the project.}
        build_id: {type: [string, "null"], format: uuid}
        plan_id: {type: [string, "null"], format: uuid, description: Archived plans cannot start a run.}
        suite_id: {type: [string, "null"], format: uuid, description: Archived suites cannot start a run; must belong to plan_id when both are supplied.}
        filter:
          $ref: '#/components/schemas/TestSuiteFilter'
        test_case_ids:
          type: array
          items: {type: string, format: uuid}
        executed_by: {type: [string, "null"], format: uuid}
    TestImport:
      type: object
      required: [cases]
      properties:
        name: {type: string}
        cases:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              classname: {type: string}
              status: {type: string, enum: [passed, failed, blocked, skipped]}
              duration_ms: {type: integer}
              failure: {type: string}
              steps:
                type: array
                items: {type: object}
    BranchInput:
      type: object
      required: [repository_id, work_item_id, name]
      properties:
        repository_id: {type: string, format: uuid}
        work_item_id: {type: string, format: uuid}
        name: {type: string}
        head_commit_sha: {type: string}
    PullRequestInput:
      type: object
      required: [repository_id, work_item_id, number, title]
      properties:
        repository_id: {type: string, format: uuid}
        work_item_id: {type: string, format: uuid}
        source_branch_id: {type: string, format: uuid}
        number: {type: integer}
        title: {type: string}
        description: {type: string}
        target_branch: {type: string}
        status: {type: string, enum: [open, draft, merged, closed]}
        review_status: {type: string, enum: [pending, approved, changes_requested]}
    ProjectSettings:
      type: object
      properties:
        merge_policy:
          type: object
          properties:
            require_linked_work_item: {type: boolean}
            require_approved_review: {type: boolean}
            require_passing_checks: {type: boolean}
        auto_rollback: {type: boolean}
        auto_deploy_on_build: {type: boolean}
        auto_deploy_environment: {type: string}
        require_health_check: {type: boolean}
    Traceability:
      type: object
