# SPM Platform API contract.
#
# Route coverage is enforced by api/internal/server tests. Regenerate with:
#   cd api && go run ./cmd/openapi -write
# Validate without writing with:
#   cd api && go run ./cmd/openapi -check

openapi: 3.1.0
info:
  title: SPM Platform API
  version: 2.0.0
  description: |-
    Offline-first software delivery platform API. The normalized workspace
    aggregate is the source of truth for SDLC/STLC artifacts. Mutations emit a
    `workspace.changed` event and bump the project SSE revision.

    This contract is generated from the Go router by `api/cmd/openapi` and
    checked by the pull-request gate. Do not edit generated operations by hand;
    update the route metadata in `api/internal/server` instead.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080
    description: Local Compose stack
security:
  - bearerAuth: []
tags:
  - name: AI
    description: Retrieval, answers and delivery insights derived from authorized project context.
  - name: Admin
    description: User administration and global role management.
  - name: Auth
    description: Authentication, profile updates and single-use stream tickets.
  - name: Code
    description: Repositories, branches, pull requests and review evidence.
  - name: Delivery
    description: Environments, artifact links and delivery configuration.
  - name: Planning
    description: PRDs, epics, features, work items, sprints, releases and tickets.
  - name: Projects
    description: Project lifecycle, settings and membership.
  - name: Reports
    description: Reports, exports and release readiness.
  - name: Search
    description: JQL-style cross-artifact search.
  - name: System
    description: Liveness and readiness probes.
  - name: Tests
    description: Test cases, runs, results and bug creation.
  - name: Webhooks
    description: Inbound Gitea, Argo CD and generic delivery events.
paths:
  /api/v1/admin/audit/events:
    get:
      tags: ["Admin"]
      summary: "List audit events"
      operationId: get_api_v1_admin_audit_events
      x-spm-auth: admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
      parameters:
        - {name: action, in: query, schema: {type: string, maxLength: 100}, description: Action prefix}
        - {name: actor_id, in: query, schema: {type: string, format: uuid}}
        - {name: project_id, in: query, schema: {type: string, format: uuid}}
        - {name: result, in: query, schema: {type: string, enum: [success, failure, denied]}}
        - {name: from, in: query, schema: {type: string}, description: RFC3339 or YYYY-MM-DD}
        - {name: to, in: query, schema: {type: string}, description: RFC3339 or YYYY-MM-DD; a date is inclusive of the whole day}
        - {name: cursor, in: query, schema: {type: string}, description: Opaque keyset cursor}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
  /api/v1/admin/audit/events/{auditId}:
    get:
      tags: ["Admin"]
      summary: "Get an audit event"
      operationId: get_api_v1_admin_audit_events_auditId
      x-spm-auth: admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvent'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
      parameters:
        - name: "auditId"
          in: path
          required: true
          schema: {type: string}
  /api/v1/admin/audit/export:
    get:
      tags: ["Admin"]
      summary: "Export audit events"
      operationId: get_api_v1_admin_audit_export
      x-spm-auth: admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            text/csv:
              schema: {type: string}
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
      parameters:
        - {name: action, in: query, schema: {type: string, maxLength: 100}, description: Action prefix}
        - {name: actor_id, in: query, schema: {type: string, format: uuid}}
        - {name: project_id, in: query, schema: {type: string, format: uuid}}
        - {name: result, in: query, schema: {type: string, enum: [success, failure, denied]}}
        - {name: from, in: query, schema: {type: string}, description: RFC3339 or YYYY-MM-DD}
        - {name: to, in: query, schema: {type: string}, description: RFC3339 or YYYY-MM-DD; a date is inclusive of the whole day}
        - {name: cursor, in: query, schema: {type: string}, description: Opaque keyset cursor}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: format, in: query, schema: {type: string, enum: [csv, json], default: csv}}
