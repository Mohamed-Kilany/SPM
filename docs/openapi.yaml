        - {name: project_id, in: query, schema: {type: string, format: uuid}}
        - {name: result, in: query, schema: {type: string, enum: [success, failure, denied]}}
        - {name: from, in: query, schema: {type: string}, description: RFC3339 or YYYY-MM-DD}
        - {name: to, in: query, schema: {type: string}, description: RFC3339 or YYYY-MM-DD; a date is inclusive of the whole day}
        - {name: cursor, in: query, schema: {type: string}, description: Opaque keyset cursor}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: format, in: query, schema: {type: string, enum: [csv, json], default: csv}}
