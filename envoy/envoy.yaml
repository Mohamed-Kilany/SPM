# SPM Platform edge proxy.
#
# Envoy terminates the browser-facing HTTP connection, routes API traffic to
# the Go backend, and forwards all other requests to the internal SPA server.
# The static server is intentionally internal-only; Envoy owns the public port.
#
# Server-Sent Events:
#   * the dedicated route has no route timeout and no idle timeout;
#   * the HTTP connection manager's stream idle timeout is disabled;
#   * no buffer filter is installed, so Envoy streams response frames as soon
#     as the API writes them. (Envoy v1.29 has no route-level
#     `buffer_response` field; omitting the buffer filter is the equivalent
#     and preferred configuration.)

admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
    - name: spm_edge
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080

      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: spm_edge
                use_remote_address: true
                # SSE connections can legitimately stay idle for long periods.
                stream_idle_timeout: 0s

                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

                route_config:
                  name: spm_routes

                  # Applied to every response, including API and direct Envoy
                  # error responses. OVERWRITE_IF_EXISTS_OR_ADD prevents
                  # duplicate values when the upstream already set a header.
                  response_headers_to_add:
                    - header:
                        key: X-Content-Type-Options
                        value: nosniff
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    - header:
                        key: X-Frame-Options
                        value: DENY
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    - header:
                        key: Referrer-Policy
                        value: strict-origin-when-cross-origin
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    - header:
                        key: Permissions-Policy
                        value: camera=(), microphone=(), geolocation=()
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    - header:
                        key: Content-Security-Policy
                        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD

                  virtual_hosts:
                    - name: spm
                      domains: ["*"]
                      routes:
                        # SSE: exact project stream endpoint. No route or
                        # idle timeout, and no response buffering.
                        - name: project_stream
                          match:
                            safe_regex:
                              regex: "^/api/v1/projects/[^/]+/stream$"
                          route:
                            cluster: api_backend
                            timeout: 0s
                            idle_timeout: 0s
                            max_stream_duration:
                              grpc_timeout_header_max: 0s

                        # All other API calls.
                        - name: api
                          match:
                            prefix: "/api/"
                          route:
                            cluster: api_backend
                            timeout: 120s
                            idle_timeout: 120s

                        # Vue SPA and its static assets.
                        - name: spa
                          match:
                            prefix: "/"
                          route:
                            cluster: ui_static
                            timeout: 30s
                            idle_timeout: 60s

  clusters:
    - name: api_backend
      type: STRICT_DNS
      dns_lookup_family: AUTO
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: api_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: api_backend
                      port_value: 8080

    - name: ui_static
      type: STRICT_DNS
      dns_lookup_family: AUTO
      connect_timeout: 2s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: ui_static
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ui_static
                      port_value: 80
