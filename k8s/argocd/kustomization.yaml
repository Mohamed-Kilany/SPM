apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Argo CD v3.5.6 non-HA installation, vendored so the stack can start without
# reaching the public internet. Update install.yaml and this version together.
namespace: argocd

resources:
  - namespace.yaml
  - install.yaml
  - nodeport-service.yaml

patches:
  # The local stack reaches Argo CD over the Docker network. Terminate TLS at
  # the edge instead of inside argocd-server, and use local-only auth for the
  # single-node development installation. For a shared installation, remove
  # server.disable.auth and set ARGOCD_TOKEN in .env.
  - target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        server.insecure: "true"
        server.disable.auth: "true"

  # k3s imports these images from the Docker daemon before applying this
  # manifest. Never let a pod attempt an external pull on a restricted host.
  - target:
      kind: Deployment
      name: argocd-applicationset-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-applicationset-controller
      spec:
        template:
          spec:
            containers:
              - name: argocd-applicationset-controller
                imagePullPolicy: IfNotPresent
  - target:
      kind: Deployment
      name: argocd-dex-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-dex-server
      spec:
        template:
          spec:
            initContainers:
              - name: copyutil
                imagePullPolicy: IfNotPresent
            containers:
              - name: dex
                imagePullPolicy: IfNotPresent
  - target:
      kind: Deployment
      name: argocd-notifications-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-notifications-controller
      spec:
        template:
          spec:
            containers:
              - name: argocd-notifications-controller
                imagePullPolicy: IfNotPresent
  - target:
      kind: Deployment
      name: argocd-redis
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-redis
      spec:
        template:
          spec:
            initContainers:
              - name: secret-init
                imagePullPolicy: IfNotPresent
            containers:
              - name: redis
                imagePullPolicy: IfNotPresent
  - target:
      kind: Deployment
      name: argocd-repo-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-repo-server
      spec:
        template:
          spec:
            initContainers:
              - name: copyutil
                imagePullPolicy: IfNotPresent
            containers:
              - name: argocd-repo-server
                imagePullPolicy: IfNotPresent
  - target:
      kind: Deployment
      name: argocd-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-server
      spec:
        template:
          spec:
            containers:
              - name: argocd-server
                imagePullPolicy: IfNotPresent
  - target:
      kind: StatefulSet
      name: argocd-application-controller
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: argocd-application-controller
      spec:
        template:
          spec:
            containers:
              - name: argocd-application-controller
                imagePullPolicy: IfNotPresent
