# NATS Server configuration for SPM Platform
# Single-node setup — no clustering needed for on-premises deployment

server_name: spm-nats

# Client connections
port: 4222

# HTTP monitoring / healthcheck
http_port: 8222

# JetStream with persistent file store
jetstream {
  store_dir: "/data"
  max_mem_store: 64MB
  max_file_store: 1GB
}

# Logging
logtime: true
