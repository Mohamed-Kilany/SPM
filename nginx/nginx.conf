# Internal static server for the Vue SPA.
#
# Envoy (ui_envoy) owns the public edge and proxies API/SSE traffic directly
# to the backend. This server only serves the built SPA and its assets.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers shared with the UI image. Locations that declare their
    # own add_header must include this file again (nginx inheritance rules).
    include /etc/nginx/security-headers.conf;

    client_max_body_size 2m;

    # Fingerprinted Vite assets are immutable.
    location /assets/ {
        try_files $uri =404;
        # `expires` sets Cache-Control without declaring add_header, so the
        # server-level security headers remain inherited.
        expires 1y;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    # Vue SPA — serve index.html for all non-file routes (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
