# OpenAPI lint configuration for docs/openapi.yaml.
#
# The contract is generated by `api/cmd/openapi` and checked for drift by the
# pull-request gate. Two recommended rules do not fit this service:
# - no-server-example.com: the documented server is the local Compose edge.
# - operation-4xx-response: the public health probes intentionally return only
#   200 or 503 and have no client-error response.
# - info-license-strict: the license text file is added by BASE-07; the
#   contract already declares a Proprietary license identifier.
extends:
  - recommended

rules:
  no-server-example.com: off
  operation-4xx-response: off
  info-license-strict: off
