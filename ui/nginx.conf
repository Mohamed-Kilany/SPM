server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers shared with the compose edge. Locations that declare
    # their own add_header must include this file again (nginx inheritance).
    include /etc/nginx/security-headers.conf;

    client_max_body_size 2m;

    # Server-Sent Events. Buffering must be off so patches are delivered as
    # soon as they are written; the long read timeout covers idle streams.
    location ~ ^/api/v1/projects/[^/]+/stream$ {
        # The one-time ticket is in the query string; never persist it in
        # access logs. Stream diagnostics are available from the API instead.
        access_log         off;
        proxy_pass         http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass         http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;
    }

    # Fingerprinted Vite assets are immutable.
    location /assets/ {
        try_files $uri =404;
        # `expires` sets Cache-Control without declaring add_header, so the
        # server-level security headers remain inherited.
        expires 1y;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    # Vue SPA — serve index.html for all non-file routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
